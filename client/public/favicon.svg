<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Municipal Portico (Civic Capitol) -->
  <!-- Triangular Pediment -->
  <path d="M32 11 L13 22 H51 Z" fill="url(#gold)"/>
  
  <!-- Architrave -->
  <rect x="14" y="23" width="36" height="3" rx="0.5" fill="#f8fafc"/>

  <!-- 4 Pillars -->
  <rect x="16" y="27" width="4.5" height="17" rx="1" fill="#f8fafc"/>
  <rect x="24.5" y="27" width="4.5" height="17" rx="1" fill="#f8fafc"/>
  <rect x="33" y="27" width="4.5" height="17" rx="1" fill="#f8fafc"/>
  <rect x="41.5" y="27" width="4.5" height="17" rx="1" fill="#f8fafc"/>

  <!-- Stepped Base -->
  <rect x="13" y="45" width="38" height="3" rx="1" fill="#f8fafc"/>
  <rect x="11" y="49" width="42" height="3" rx="1" fill="url(#gold)"/>

  <!-- Verified Badge (Bottom Right) -->
  <circle cx="49" cy="49" r="10" fill="#10b981" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M44.5 49 L47.5 52 L53.5 46" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
